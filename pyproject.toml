[project]
name = "claudefm"
version = "0.2.0"
description = "Generative lo-fi radio with animated landscapes in a GPU window, built on the kor engine"
requires-python = ">=3.10,<3.16"
dependencies = [
    "kor",
    "numpy>=1.26",
    "warp-lang>=1.9",
    "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
kor = { path = "../kor", editable = true }

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.8.1",
]
